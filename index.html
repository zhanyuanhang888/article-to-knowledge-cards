<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章转知识卡片</title>
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --text:#1f2430;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#ff2442;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  header h1{font-size:24px;margin:0}
  header p{margin:0;color:var(--muted);font-size:14px}
  .layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700}
  label.field{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
  label.field > span{display:block;margin-bottom:5px;font-weight:600;color:var(--text)}
  input[type=text],input[type=number],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{min-height:210px;resize:vertical;line-height:1.7}
  .row{display:flex;gap:10px}
  .row > *{flex:1;min-width:0}
  .actions{display:flex;gap:10px;margin-top:8px}
  button{
    border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .1s,opacity .15s
  }
  button:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:#fff;flex:1}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:#f3f4f6;color:var(--text)}
  .btn-ghost:hover{background:#e9ebef}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .card-item{position:relative}
  .card-item canvas{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.1);background:#fff}
  .card-bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
  .card-bar button{padding:5px 9px;font-size:12px;background:#f3f4f6;color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:64px 20px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>文章转知识卡片</h1>
    <p>粘贴文章 → 自动提取要点 → 生成竖版卡片 → 导出 PNG（纯本地，不上传任何内容）</p>
  </header>

  <div class="layout">
    <section class="panel">
      <h2><span class="step">1</span>输入与设置</h2>

      <label class="field"><span>卡片主标题</span>
        <input type="text" id="titleInput" placeholder="留空则取文章第一句">
      </label>

      <label class="field"><span>文章正文</span>
        <textarea id="articleInput" placeholder="在这里粘贴文章……支持按段落/句号自动切分要点"></textarea>
      </label>

      <div class="row">
        <label class="field"><span>每卡要点数</span>
          <input type="number" id="perCard" value="3" min="1" max="6">
        </label>
        <label class="field"><span>主题色</span>
          <input type="text" id="colorInput" value="#ff2442" placeholder="#ff2442">
        </label>
      </div>

      <label class="field"><span>底部署名</span>
        <input type="text" id="authorInput" placeholder="@你的账号">
      </label>

      <div class="actions">
        <button class="btn-primary" id="genBtn">生成卡片</button>
        <button class="btn-ghost" id="clearBtn">清空</button>
      </div>
      <p class="hint">提示：生成的卡片为 750×1000 竖版（3:4），适配小红书 / 朋友圈。所有处理都在你的浏览器本地完成。</p>
    </section>

    <section class="panel">
      <h2><span class="step">2</span>卡片预览 <span id="count" style="font-weight:400;color:var(--muted)"></span></h2>
      <div class="cards" id="cards">
        <div class="empty">点击左侧「生成卡片」开始 ✨</div>
      </div>
      <div class="actions" id="exportBar" style="display:none;margin-top:18px">
        <button class="btn-primary" id="exportAllBtn">导出全部 PNG</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const $ = function(id){ return document.getElementById(id); };
  const W = 750, H = 1000;
  let cards = [];

  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // 把文章切成要点句
  function splitPoints(text){
    const paras = text.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
    const points = [];
    paras.forEach(function(p){
      const parts = p.split(/(?<=[。！？!?；;])/);
      parts.forEach(function(s){
        s = s.replace(/^[\s\-•·、\d.]+/, "").trim();
        if (s.length >= 8 && points.indexOf(s) === -1) points.push(s);
      });
    });
    if (points.length === 0 && text.trim()) points.push(text.trim());
    return points.slice(0, 60);
  }

  function wrapText(ctx, text, maxWidth, maxLines){
    const chars = Array.from(text);
    const lines = [];
    let line = "";
    for (let i = 0; i < chars.length; i++){
      const test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = chars[i];
        if (lines.length === maxLines) break;
      } else {
        line = test;
      }
    }
    if (lines.length < maxLines && line) lines.push(line);
    if (lines.length === maxLines){
      const last = lines[maxLines - 1];
      let joined = lines.slice(0, maxLines - 1).join("") + last;
      if (joined.length < text.length && last.length > 1){
        let cut = last.slice(0, -1);
        while (cut.length > 1 && ctx.measureText(cut + "…").width > maxWidth) cut = cut.slice(0, -1);
        lines[maxLines - 1] = cut + "…";
      }
    }
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function hexToRgb(hex){
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
    return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [255,36,66];
  }

  function drawCard(canvas, data, index, total){
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    const accent = data.color;
    const rgb = hexToRgb(accent);

    // 背景
    ctx.fillStyle = "#fffaf7";
    ctx.fillRect(0, 0, W, H);

    // 顶部色块
    ctx.fillStyle = accent;
    ctx.fillRect(0, 0, W, 250);
    // 装饰圆
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(W - 60, 60, 130, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(80, 230, 80, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // 顶部标签
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "500 24px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("知识卡片 · KNOWLEDGE CARD", 48, 70);

    // 标题
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px 'PingFang SC','Microsoft YaHei',sans-serif";
    const titleLines = wrapText(ctx, data.title, W - 96, 3);
    let ty = 130;
    titleLines.forEach(function(line){
      ctx.fillText(line, 48, ty);
      ty += 62;
    });

    // 要点区背景
    ctx.fillStyle = "#ffffff";
    roundRect(ctx, 36, 282, W - 72, H - 360, 24);
    ctx.fill();
    ctx.strokeStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",.18)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 要点
    const points = data.points;
    const maxPerCard = data.perCard;
    const areaTop = 330;
    const areaBottom = H - 110;
    const blockH = Math.min(150, (areaBottom - areaTop) / maxPerCard);

    points.forEach(function(pt, i){
      const y = areaTop + i * blockH;

      // 序号圆点
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.arc(84, y + 16, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(i + 1), 84, y + 23);
      ctx.textAlign = "left";

      // 要点文字
      ctx.fillStyle = "#252a35";
      ctx.font = "400 27px 'PingFang SC','Microsoft YaHei',sans-serif";
      const lines = wrapText(ctx, pt, W - 180, 4);
      lines.forEach(function(line, li){
        ctx.fillText(line, 122, y + 8 + li * 38);
      });
    });

    // 底部
    ctx.fillStyle = accent;
    ctx.fillRect(0, H - 88, W, 88);
    ctx.fillStyle = "#fff";
    ctx.font = "500 24px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(data.author || "文章转知识卡片", 48, H - 35);
    ctx.textAlign = "right";
    ctx.fillText(index + " / " + total, W - 48, H - 35);
    ctx.textAlign = "left";
  }

  function buildCards(){
    const article = $("articleInput").value.trim();
    if (!article){ toast("请先粘贴文章内容"); return; }

    const points = splitPoints(article);
    if (!points.length){ toast("没有提取到有效要点"); return; }

    const per = Math.max(1, Math.min(6, parseInt($("perCard").value, 10) || 3));
    const title = $("titleInput").value.trim() || points[0];
    const color = /^#[0-9a-fA-F]{6}$/.test($("colorInput").value.trim()) ? $("colorInput").value.trim() : "#ff2442";
    const author = $("authorInput").value.trim();

    cards = [];
    for (let i = 0; i < points.length; i += per){
      cards.push({
        title: title,
        points: points.slice(i, i + per),
        color: color,
        author: author,
        perCard: per
      });
    }

    renderCards();
    toast("已生成 " + cards.length + " 张卡片");
  }

  function renderCards(){
    const box = $("cards");
    box.innerHTML = "";
    $("count").textContent = cards.length ? "（" + cards.length + " 张）" : "";
    $("exportBar").style.display = cards.length ? "flex" : "none";

    if (!cards.length){
      box.innerHTML = '<div class="empty">点击左侧「生成卡片」开始 ✨</div>';
      return;
    }

    cards.forEach(function(data, i){
      const item = document.createElement("div");
      item.className = "card-item";
      const canvas = document.createElement("canvas");
      drawCard(canvas, data, i + 1, cards.length);
      const bar = document.createElement("div");
      bar.className = "card-bar";
      bar.innerHTML = '<span>第 ' + (i + 1) + ' 张</span>';
      const btn = document.createElement("button");
      btn.textContent = "下载";
      btn.onclick = function(){ download(canvas, data.title, i + 1); };
      bar.appendChild(btn);
      item.appendChild(canvas);
      item.appendChild(bar);
      box.appendChild(item);
    });
  }

  function download(canvas, title, n){
    const a = document.createElement("a");
    a.download = "知识卡片-" + String(n).padStart(2, "0") + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  }

  function exportAll(){
    const list = $("cards").querySelectorAll("canvas");
    if (!list.length) return;
    toast("开始导出 " + list.length + " 张卡片…");
    list.forEach(function(cv, i){
      setTimeout(function(){ download(cv, "", i + 1); }, i * 350);
    });
  }

  $("genBtn").onclick = buildCards;
  $("clearBtn").onclick = function(){
    $("articleInput").value = "";
    $("titleInput").value = "";
    cards = [];
    renderCards();
    toast("已清空");
  };
  $("exportAllBtn").onclick = exportAll;
})();
</script>
</body>
</html>
